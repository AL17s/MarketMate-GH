<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005431" />
      <stop offset="100%" stop-color="#023b22" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner subtle border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" />

  <!-- Main Storefront Illustration -->
  <g filter="url(#shadow)" transform="translate(40, 36)">
    <!-- Awning / Canopy -->
    <path d="M56 160 L376 160 L396 220 L36 220 Z" fill="#0f172a" opacity="0.2" />
    <path d="M50 150 L382 150 L402 210 L30 210 Z" fill="url(#gold)" />
    
    <!-- Awning Stripes -->
    <path d="M94 150 L124 150 L110 210 L80 210 Z" fill="#b45309" />
    <path d="M164 150 L194 150 L180 210 L150 210 Z" fill="#b45309" />
    <path d="M238 150 L268 150 L254 210 L224 210 Z" fill="#b45309" />
    <path d="M308 150 L338 150 L324 210 L294 210 Z" fill="#b45309" />

    <!-- Awning scalloped frills -->
    <circle cx="55" cy="210" r="25" fill="url(#gold)" />
    <circle cx="105" cy="210" r="25" fill="#b45309" />
    <circle cx="155" cy="210" r="25" fill="url(#gold)" />
    <circle cx="205" cy="210" r="25" fill="#b45309" />
    <circle cx="255" cy="210" r="25" fill="url(#gold)" />
    <circle cx="305" cy="210" r="25" fill="#b45309" />
    <circle cx="355" cy="210" r="25" fill="url(#gold)" />
    <circle cx="377" cy="210" r="25" fill="#b45309" />

    <!-- Store Walls -->
    <rect x="66" y="225" width="300" height="175" rx="16" fill="#ffffff" />

    <!-- Store Door -->
    <rect x="180" y="270" width="72" height="130" rx="8" fill="#0f172a" />
    <circle cx="236" cy="336" r="5" fill="url(#gold)" />

    <!-- Store Window (Left) -->
    <rect x="94" y="260" width="64" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" />
    <line x1="126" y1="260" x2="126" y2="324" stroke="#0284c7" stroke-width="2" />
    <line x1="94" y1="292" x2="158" y2="292" stroke="#0284c7" stroke-width="2" />

    <!-- Store Window (Right - POS Register) -->
    <rect x="274" y="260" width="64" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" />
    <line x1="306" y1="260" x2="306" y2="324" stroke="#0284c7" stroke-width="2" />
    <line x1="274" y1="292" x2="338" y2="292" stroke="#0284c7" stroke-width="2" />

    <!-- Ghana Cedi Badge on Roof -->
    <circle cx="216" cy="100" r="44" fill="url(#accent)" stroke="#ffffff" stroke-width="4" />
    <text x="216" y="116" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">₵</text>
  </g>
</svg>
